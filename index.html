<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b3d2e" />
    <title>Work Dashboard</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%230e1a16'/%3E%3Crect x='3' y='3' width='4.5' height='4.5' rx='1' fill='%232bd4a0'/%3E%3Crect x='8.5' y='3' width='4.5' height='4.5' rx='1' fill='%2314b386'/%3E%3Crect x='3' y='8.5' width='4.5' height='4.5' rx='1' fill='%2314b386'/%3E%3Crect x='8.5' y='8.5' width='4.5' height='4.5' rx='1' fill='%232bd4a0'/%3E%3C/svg%3E" />
    <style>
      :root {
        --bg: #0e1a16;
        --card: #16241f;
        --card-soft: #0f1d18;
        --border: #28453a;
        --text: #eaf4ef;
        --text-dim: #93ada3;
        --accent: #2bd4a0;
        --accent-strong: #14b386;
        --warn: #ffc857;
        --danger: #ff6b6b;
        --radius: 16px;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        background: radial-gradient(120% 90% at 50% 0%, #14302440, var(--bg));
        color: var(--text);
        padding: max(20px, env(safe-area-inset-top)) 16px 40px;
        -webkit-font-smoothing: antialiased;
      }
      .app { width: 100%; max-width: 1180px; margin: 0 auto; }

      /* ---- header ---- */
      .top {
        display: flex;
        align-items: baseline;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }
      .top h1 { font-size: 1.35rem; margin: 0; letter-spacing: 0.02em; }
      .top .sub { color: var(--text-dim); font-size: 0.85rem; }
      .top .spacer { flex: 1 1 auto; }
      .badge {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 3px 10px;
        color: var(--accent);
      }
      button {
        font: inherit;
        font-size: 0.85rem;
        color: var(--text);
        background: #11221c;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px 14px;
        cursor: pointer;
      }
      button:hover { border-color: var(--accent-strong); }
      button:active { transform: translateY(1px); }
      button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      button.primary { background: var(--accent-strong); border-color: var(--accent-strong); color: #042018; font-weight: 600; }

      /* ---- connect banner ---- */
      #connect { display: none; margin-bottom: 18px; }
      #connect.show { display: block; }
      .banner {
        background: var(--card);
        border: 1px solid var(--border);
        border-left: 3px solid var(--warn);
        border-radius: var(--radius);
        padding: 14px 18px;
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
      }
      .banner p { margin: 0; font-size: 0.9rem; color: var(--text-dim); }

      /* ---- cards ---- */
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 16px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 18px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        min-width: 0;
      }
      .card.hero { border-color: #2f6a55; background: linear-gradient(160deg, #172f26, var(--card)); }
      .card h2 {
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--text-dim);
        margin: 0 0 14px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .card h2 .count {
        margin-left: auto;
        font-size: 0.72rem;
        letter-spacing: 0.04em;
        color: var(--text-dim);
        text-transform: none;
      }

      ul.list { list-style: none; margin: 0; padding: 0; }
      ul.list > li + li { border-top: 1px solid #21382f; }
      .row {
        display: block;
        padding: 11px 0;
        color: inherit;
        text-decoration: none;
        border-radius: 8px;
      }
      a.row:hover { background: #1b2f27; padding-left: 8px; padding-right: 8px; margin: 0 -8px; }
      .row .line1 { display: flex; align-items: baseline; gap: 8px; }
      .row .who { font-weight: 600; font-size: 0.92rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .row .when { margin-left: auto; font-size: 0.74rem; color: var(--text-dim); white-space: nowrap; }
      .row .title {
        font-size: 0.9rem;
        margin-top: 2px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .row .snippet {
        font-size: 0.82rem;
        color: var(--text-dim);
        margin-top: 3px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .unread .who::before {
        content: "";
        display: inline-block;
        width: 7px; height: 7px;
        border-radius: 50%;
        background: var(--accent);
        margin-right: 7px;
        vertical-align: middle;
      }
      .unread .title { font-weight: 600; }

      .pill {
        font-size: 0.68rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        border-radius: 999px;
        padding: 2px 8px;
        border: 1px solid var(--border);
        color: var(--text-dim);
        white-space: nowrap;
      }
      .pill.hot { color: var(--danger); border-color: #57302f; background: #2a1a1a; }
      .pill.warm { color: var(--warn); border-color: #55482a; background: #262018; }
      .pill.done { color: var(--text-dim); opacity: 0.8; }
      .pill.live { color: #042018; background: var(--accent); border-color: var(--accent); font-weight: 700; }

      /* ---- next appointment ---- */
      .countdown { font-size: 0.8rem; color: var(--accent); letter-spacing: 0.04em; text-transform: uppercase; }
      .hero-title { font-size: 1.5rem; font-weight: 650; margin: 6px 0 8px; line-height: 1.25; }
      .hero-meta { color: var(--text-dim); font-size: 0.9rem; display: flex; gap: 14px; flex-wrap: wrap; }
      .hero-actions { margin-top: 14px; display: flex; gap: 10px; flex-wrap: wrap; }
      .hero-actions a {
        text-decoration: none;
        font-size: 0.85rem;
        padding: 8px 14px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: #11221c;
        color: var(--text);
      }
      .hero-actions a.primary { background: var(--accent-strong); border-color: var(--accent-strong); color: #042018; font-weight: 600; }
      .later { margin-top: 16px; border-top: 1px solid #21382f; padding-top: 6px; }

      /* ---- states ---- */
      .empty, .error {
        font-size: 0.87rem;
        color: var(--text-dim);
        padding: 10px 0;
        margin: 0;
      }
      .error { color: var(--danger); }
      .empty .fix, .error .fix { display: block; margin-top: 8px; color: var(--accent); text-decoration: none; }
      .empty .fix:hover, .error .fix:hover { text-decoration: underline; }
      .skeleton { height: 12px; border-radius: 6px; background: #1e332b; margin: 12px 0; animation: pulse 1.4s ease-in-out infinite; }
      .skeleton:nth-child(2n) { width: 70%; }
      @keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 0.9; } }

      footer { margin-top: 22px; text-align: center; color: var(--text-dim); font-size: 0.75rem; }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="top">
        <h1>Work Dashboard</h1>
        <span class="badge" id="demoBadge" hidden>demo data</span>
        <span class="spacer"></span>
        <span class="sub" id="updated">loading…</span>
        <button id="refreshBtn">Refresh</button>
      </div>

      <div id="connect"><div class="banner">
        <p id="connectText"></p>
        <span class="spacer"></span>
        <span id="connectButtons"></span>
      </div></div>

      <section class="card hero" id="eventsCard" style="margin-bottom:16px">
        <h2>Next appointment <span class="count" id="eventsCount"></span></h2>
        <div id="events"><div class="skeleton"></div><div class="skeleton"></div></div>
      </section>

      <div class="grid">
        <section class="card">
          <h2>Latest emails <span class="count" id="emailsCount"></span></h2>
          <div id="emails"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
        </section>

        <section class="card">
          <h2>Last Salesforce cases <span class="count" id="casesCount"></span></h2>
          <div id="cases"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
        </section>

        <section class="card">
          <h2>Latest chat messages <span class="count" id="chatsCount"></span></h2>
          <div id="chats"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
        </section>
      </div>

      <footer>Refreshes every minute · everything is read-only</footer>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
